name: PACUS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/Pacus.sln
      - run: dotnet build backend/Pacus.sln --configuration Release --no-restore
      - run: dotnet test backend/Pacus.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find frontend/js -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
