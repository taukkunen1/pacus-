name: PACUS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/Pacus.sln
      - run: dotnet build backend/Pacus.sln --configuration Release --no-restore
      - name: dotnet test
        env:
          JWT_SECRET: ci-placeholder-secret-nao-usar-em-producao-0123456789
        run: |
          set -o pipefail
          dotnet test backend/Pacus.sln --configuration Release --no-build 2>&1 | tee /tmp/test-output.txt

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=PACUS_API_BASE_URL=https://pacus-pacus-api.fly.dev/api/v1
