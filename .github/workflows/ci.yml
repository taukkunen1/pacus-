name: PACUS CI

on:
  push:
    branches: ["main", "feature/next-migration"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/Pacus.sln
      - run: dotnet build backend/Pacus.sln --configuration Release --no-restore
      - name: dotnet test
        # JWT_SECRET precisa existir no ambiente porque Program.cs le essa
        # variavel de forma eager (fora de qualquer DI), antes do
        # WebApplicationFactory dos testes de integracao ter chance de
        # injetar a propria config de teste (Jwt:Secret) -- sem isso o app
        # nunca sobe em CI e todo teste de integracao falha com
        # "JWT_SECRET nao configurada.". Valor aqui e so um placeholder de
        # CI, nunca usado em producao (isso continua vindo do Render).
        env:
          JWT_SECRET: ci-placeholder-secret-nao-usar-em-producao-0123456789
        run: |
          set -o pipefail
          dotnet test backend/Pacus.sln --configuration Release --no-build 2>&1 | tee /tmp/test-output.txt
      - name: Emit test failures as annotations (debug aid)
        if: failure()
        run: |
          grep -nE "^\s*Failed\s|\[FAIL\]|Total tests:|Passed:|Failed:|error CS" /tmp/test-output.txt > /tmp/test-summary.txt || true
          grep -B1 -A30 -E "^\s*Failed\s" /tmp/test-output.txt > /tmp/test-fail-detail.txt || true
          {
            echo "=== SUMMARY ==="
            cat /tmp/test-summary.txt
            echo "=== FAILURE DETAIL ==="
            cat /tmp/test-fail-detail.txt
          } > /tmp/test-fail-excerpt.txt
          echo "::error::$(cat /tmp/test-fail-excerpt.txt | tr '\n' '~' | sed 's/~/%0A/g' | cut -c1-60000)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find frontend/js -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
