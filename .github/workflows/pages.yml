name: Deploy PACUS Flutter Web

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/pages.yml'
      - 'CNAME'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      # Keep errors and warnings blocking; Flutter stable reports legacy Material imports as info.
      - run: flutter analyze --no-fatal-infos
      - run: flutter build web --release --dart-define=PACUS_API_BASE_URL=https://pacus-pacus-api.fly.dev/api/v1

      - name: Version Flutter entry points for browser caches
        env:
          PACUS_RELEASE: ${{ github.sha }}
        run: |
          cd build/web
          grep -Fq 'src="flutter_bootstrap.js"' index.html
          grep -Eq '"mainJsPath"[[:space:]]*:[[:space:]]*"main\.dart\.js"' flutter_bootstrap.js
          sed -i "s|src=\"flutter_bootstrap.js\"|src=\"flutter_bootstrap.js?v=${PACUS_RELEASE}\"|" index.html
          sed -i "s|main.dart.js\"|main.dart.js?v=${PACUS_RELEASE}\"|g" flutter_bootstrap.js
          grep -Fq "flutter_bootstrap.js?v=${PACUS_RELEASE}" index.html
          grep -Fq "main.dart.js?v=${PACUS_RELEASE}" flutter_bootstrap.js

      - name: Preserve custom domain
        run: cp ../CNAME build/web/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './flutter_app/build/web'

      - id: deployment
        uses: actions/deploy-pages@v4
