name: PACUS Production Health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: pacus-production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API and MongoDB
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 5             https://pacus-pacus-api.fly.dev/api/v1/health)"
          python - "$BODY" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get("status") == "ok", data
          assert data.get("database") == "connected", data
          print("API e MongoDB OK")
          PY

      - name: Check official frontend
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5             --output /dev/null https://www.pacus.com.br/

      - name: Verify official CORS origin
        shell: bash
        run: |
          set -euo pipefail
          HEADERS="$(mktemp)"
          curl --fail --silent --show-error             -H "Origin: https://www.pacus.com.br"             -D "$HEADERS"             -o /dev/null             https://pacus-pacus-api.fly.dev/api/v1/health
          grep -Eqi '^access-control-allow-origin: https://www\.pacus\.com\.br\r?$' "$HEADERS"

      - name: Verify retired Render origin stays blocked
        shell: bash
        run: |
          set -euo pipefail
          HEADERS="$(mktemp)"
          curl --fail --silent --show-error             -H "Origin: https://pacus-1.onrender.com"             -D "$HEADERS"             -o /dev/null             https://pacus-pacus-api.fly.dev/api/v1/health
          if grep -Eqi '^access-control-allow-origin:' "$HEADERS"; then
            echo "::error::Origem antiga do Render voltou a ser aceita por CORS."
            cat "$HEADERS"
            exit 1
          fi

      - name: Summary
        run: |
          echo "PACUS production health OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: https://www.pacus.com.br" >> "$GITHUB_STEP_SUMMARY"
          echo "- API/MongoDB: healthy" >> "$GITHUB_STEP_SUMMARY"
          echo "- CORS oficial: validado" >> "$GITHUB_STEP_SUMMARY"
