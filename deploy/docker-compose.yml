services:
  api:
    build:
      context: ../backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-pacus}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5500}
    ports:
      - "8080:8080"
